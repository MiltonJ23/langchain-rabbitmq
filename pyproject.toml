[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata (PEP 621)
# ---------------------------------------------------------------------------
[project]
name = "langchain-rabbitmq"
version = "0.1.0"
description = "LangChain tools for interacting with RabbitMQ via AMQP and the Management HTTP API"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "MiltonJ23", email = "" }]
requires-python = ">=3.9"
keywords = ["langchain", "rabbitmq", "amqp", "tools", "agents", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
dependencies = [
    "langchain-core>=0.2.0",
    "pydantic>=2.0",
    "pika>=1.3",
    "aio-pika>=9.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "testcontainers>=4.0",
    "ruff>=0.3.0",
    "pyright>=1.1.350",
    "bandit[toml]>=1.7",
    "mypy>=1.8",
    "httpx>=0.27",       # used by admin HTTP client in tests
    "respx>=0.20",       # HTTP mock for httpx in unit tests
]
docs = [
    "mkdocs>=1.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage   = "https://github.com/MiltonJ23/langchain-rabbitmq"
Repository = "https://github.com/MiltonJ23/langchain-rabbitmq"
Issues     = "https://github.com/MiltonJ23/langchain-rabbitmq/issues"
Changelog  = "https://github.com/MiltonJ23/langchain-rabbitmq/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Hatch: source layout
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/langchain_rabbitmq"]

# ---------------------------------------------------------------------------
# Ruff: linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py39"
line-length    = 88
src            = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations (type hints required)
    "RUF",  # ruff-specific rules
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking imports
    "PTH",  # pathlib over os.path
]
ignore = [
    "ANN101",  # self does not need annotation
    "ANN102",  # cls does not need annotation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",    # no annotation requirements in tests
    "S101",   # assert is allowed in tests
]

[tool.ruff.lint.isort]
known-first-party = ["langchain_rabbitmq"]

# ---------------------------------------------------------------------------
# Pyright: strict type checking
# ---------------------------------------------------------------------------
[tool.pyright]
include                  = ["src"]
pythonVersion            = "3.9"
typeCheckingMode         = "strict"
reportUnknownMemberType  = true
reportMissingTypeStubs   = false
reportUnnecessaryTypeIgnoreComment = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = [
    "--cov=langchain_rabbitmq",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "-v",
]
markers = [
    "unit: Unit tests with no external dependencies",
    "integration: Integration tests requiring a live RabbitMQ container",
    "e2e: End-to-end agent tests",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source  = ["src/langchain_rabbitmq"]
branch  = true

[tool.coverage.report]
fail_under    = 90
show_missing  = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# Bandit
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["src"]
skips   = ["B101"]  # assert is acceptable in non-production paths

# ---------------------------------------------------------------------------
# Mypy (complementary; pyright is primary)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version          = "3.9"
strict                  = true
ignore_missing_imports  = false
warn_return_any         = true
warn_unused_ignores     = true
