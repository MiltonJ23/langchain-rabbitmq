site_name: langchain-rabbitmq
site_description: Production-grade LangChain tools for RabbitMQ
site_url: https://miltonj23.github.io/langchain-rabbitmq
repo_url: https://github.com/MiltonJ23/langchain-rabbitmq
repo_name: MiltonJ23/langchain-rabbitmq
edit_uri: edit/main/docs/

validation:
  links:
    not_found: ignore

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.annotate
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Configuration: configuration.md
  - Tools:
      - Overview: tools/index.md
      - Queue management: tools/queue.md
      - Exchange management: tools/exchange.md
      - Message operations: tools/message.md
      - Admin & monitoring: tools/admin.md
  - API reference:
      - Overview: api/index.md
      - Config: api/config.md
      - Exceptions: api/exceptions.md
      - Toolkit: api/toolkit.md
      - Tools: api/tools.md
      - Utilities: api/utilities.md
  - Cookbooks:
      - Basic agent: cookbooks/01_basic_agent.md
      - Async agent: cookbooks/02_async_agent.md
      - Advanced patterns: cookbooks/03_advanced_patterns.md
  - Contributing: contributing.md
  - Changelog: changelog.md
  - Code of conduct: code_of_conduct.md
